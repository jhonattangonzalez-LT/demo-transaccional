spring.application.name=paylink
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.session.tracking-modes=cookie

# H2 en memoria (se recrea en cada arranque con data.sql)
spring.datasource.url=jdbc:h2:mem:paylink;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.thymeleaf.cache=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Swagger / OpenAPI: solo documenta la API REST (no las pantallas Thymeleaf)
springdoc.packages-to-scan=com.quind.paylink.controller.api
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.default-produces-media-type=application/json

# API key del comercio demo usada por la pantalla de inicio (/) — solo mockup
paylink.demo-api-key=demo-api-key-123
