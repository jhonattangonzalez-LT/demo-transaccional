# Perfil para el despliegue en Vercel (contenedor sin estado + PostgreSQL/Neon).
# La conexión se toma de la variable de entorno DATABASE_URL (formato postgresql://...)
# o de SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD.
# Nunca escribir credenciales en este archivo.

# Vercel enruta al puerto 80 salvo que se defina PORT
server.port=${PORT:80}

spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=15000

# El esquema persiste entre instancias: se actualiza, nunca se borra
spring.jpa.hibernate.ddl-auto=update
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:data-postgres.sql

spring.h2.console.enabled=false
spring.thymeleaf.cache=true
